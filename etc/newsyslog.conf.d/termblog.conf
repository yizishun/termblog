# termblog 日志轮转 —— FreeBSD newsyslog(8) 配置(/etc/crontab 每小时驱动)。
#
# 规则: 文件超过 500KB 即轮转, 保留 7 份归档(.0 最新)。zroot 开了 lz4
# 原生压缩, 归档不再重复压(不写 J/X/Y/Z 标志)。轮转后 newsyslog 按
# pid_file 给 daemon 监督进程发 SIGHUP, daemon -H 负责 close+reopen 输出
# 文件, 四个服务进程本身无感——不重启、不丢句柄。
#
# logfilename          [owner:group] mode count size when flags [/pid_file] [sig_num]
/var/log/commentd.log         root:wheel 640 7    500  *    C    /var/run/commentd-super.pid
/var/log/jaild.log           root:wheel 640 7    500  *    C    /var/run/jaild-super.pid
/var/log/termblog-web.log    root:wheel 640 7    500  *    C    /var/run/termblog-web-super.pid
/var/log/termblog-ssh.log    root:wheel 640 7    500  *    C    /var/run/termblog-ssh-super.pid
