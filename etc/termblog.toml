# termblog 运行配置(jaild / termblog-web / termblog-ssh 三个二进制共用)

[web]
# 80 只承载 ACME HTTP-01 与 308 HTTPS 跳转。
# 80/443 都是特权端口, www 用户直绑需 mac_portacl 分别放行。
# (完整步骤见 docs/deploy-aliyun-freebsd.md 阶段 6.5)
listen = "0.0.0.0:80"
static_dir = "/usr/local/share/termblog/frontend"
# 站点对外绝对地址(不带尾斜杠)。canonical/sitemap/atom/OG 用;不设则镜像页
# 照常生成, 只是不产出 sitemap/atom 与 canonical(部署后务必设置!)
site_url = "https://www.yizishun.com"
# 站点标题: 镜像页 <title> / og:site_name / atom feed 标题用
site_title = "~yzs"

[web.tls]
# termblog-web 直接使用 rustls 提供 HTTPS/WSS；rustls-acme 通过 80 端口的
# HTTP-01 自动申请与续期 Let's Encrypt 证书，无需 nginx/certbot。
enabled = true
listen = "0.0.0.0:443"
domains = ["www.yizishun.com"]
# 可留空；填写时格式为 ["mailto:you@example.com"]。
contacts = []
cache_dir = "/var/db/termblog/acme"
# 本地验证时改 false 使用 Let's Encrypt staging，生产保持 true。
production = true

[ssh]
# 22 为特权端口: www 直绑需 mac_portacl 放行 uid:80:tcp:22(保留段上界须≤21),
# 系统 sshd 已迁至 2222。详见 docs/deploy-aliyun-freebsd.md 阶段 6.5/6.6
listen = "0.0.0.0:22"
user = "blog"
host_key = "/var/db/termblog/ssh_host_ed25519"

[session]
max_total = 16
max_per_ip = 3
# 仅键盘/粘贴输入续期；持续输出、窗口 resize 与 keepalive 都不算用户活动。
idle_timeout_secs = 900
# M4 落地(先占位)
hard_lifetime_secs = 7200

[jail]
# jaild 的 Unix socket: 接入层(web/ssh)与特权 jaild 之间的唯一通道
socket = "/var/run/termblog.sock"
template = "zroot/jails/template@release"
dataset_prefix = "zroot/jails/s-"
# 每会话可写空间上限(ZFS quota; 模板共享块不计入), 防写爆宿主池
disk_quota = "4M"
path_prefix = "/jails"
memory = "128M"
vmemory = "512M"
maxproc = 32
# 每个 guest 进程的 RLIMIT_NOFILE；不是整个 jail 的聚合 openfiles rctl。
openfiles = 256
pcpu = 25
zsh = "/usr/local/bin/zsh"
guest_user = "guest"

[comments]
public_socket = "/var/run/commentd-public.sock"
private_socket = "/var/run/commentd-private.sock"
data_dir = "/var/db/termblog-commentd"
targets_file = "/usr/local/share/termblog/comment-targets.tsv"
session_drain_ms = 1000

[stats]
socket = "/var/run/termblog-statd.sock"
data_dir = "/var/db/termblog-statd"
# 统计是非关键链路；超时后访问照常继续。
request_timeout_ms = 250
