[workspace]
resolver = "2"
members = ["crates/proto", "crates/core", "crates/web", "crates/ssh", "crates/jaild"]

[workspace.dependencies]
anyhow = "1"
bytes = "1"
nix = { version = "0.29", features = ["term", "fs", "signal", "process", "user", "socket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-seqpacket = "0.9"
toml = "0.8"
tracing = "0.1"
