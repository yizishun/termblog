[workspace]
resolver = "2"
members = ["crates/proto", "crates/core", "crates/web"] # M2 加入 "crates/ssh"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
nix = { version = "0.29", features = ["term", "fs", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
