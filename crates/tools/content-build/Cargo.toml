[package]
name = "content-build"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 图片管线: 解码拿真实尺寸 + 超宽缩小重编码。gif 只解码不重编码(保动画);
# 明确不支持 svg(同域脚本风险)/avif(编码支持不成熟)。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pulldown-cmark = "0.13"
termblog-config = { path = "../../config" }
unicode-width = "0.2"
