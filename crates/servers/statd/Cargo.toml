[package]
name = "termblog-statd"
version = "0.1.0"
edition = "2021"

[lib]
name = "termblog_statd"
path = "src/lib.rs"

[[bin]]
name = "termblog-statd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
hmac.workspace = true
libc = "0.2"
nix.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"
termblog-config = { path = "../../config" }
termblog-content-model = { path = "../../content-model" }
termblog-core = { path = "../core" }
termblog-proto = { path = "../proto" }

[dev-dependencies]
tempfile = "3"
